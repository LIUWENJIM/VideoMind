services:
  mysql:
    image: mysql:8.0
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: media_db
      MYSQL_USER: ${MYSQL_APP_USER:-dovideo}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./mysql/data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    deploy:
      resources:
        limits:
          memory: 128M
    ports:
      - "127.0.0.1:6380:6379"
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass dovideo123"]
    volumes:
      - ./redis/data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a dovideo123 ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.18.2
    deploy:
      resources:
        limits:
          memory: 1G
    ports:
      - "127.0.0.1:6333:6333"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required}
    volumes:
      - ./qdrant/data:/qdrant/storage

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    command: server /data --console-address ":9001"
    volumes:
      - ./minio/data:/data

  rmqnamesrv:
    image: apache/rocketmq:4.9.4
    deploy:
      resources:
        limits:
          memory: 384M
    ports:
      - "127.0.0.1:9876:9876"
    command: sh mqnamesrv

  rmqbroker:
    image: apache/rocketmq:4.9.4
    deploy:
      resources:
        limits:
          memory: 1G
    ports:
      - "127.0.0.1:10911:10911"
      - "127.0.0.1:10909:10909"
    environment:
      NAMESRV_ADDR: rmqnamesrv:9876
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"
    command: >
      sh -c "echo 'brokerIP1=127.0.0.1' >> /home/rocketmq/rocketmq-4.9.4/conf/broker.conf &&
             echo 'autoCreateTopicEnable=true' >> /home/rocketmq/rocketmq-4.9.4/conf/broker.conf &&
             exec sh mqbroker -n rmqnamesrv:9876 -c /home/rocketmq/rocketmq-4.9.4/conf/broker.conf"
    depends_on:
      - rmqnamesrv

volumes:
  rocketmq-store:
  rocketmq-logs:
